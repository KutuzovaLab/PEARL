#   python -m src.mzml_to_npy              --config configs/standards.yaml --section images
#   python -m src.taskconvert inference    --src results/eic/standards/images --task Task200_standards --prefix standards
#   python -m src.extracting_labels_erosion --config configs/standards.yaml --section labels
#   python -m src.matching_MS1_MS2         --config configs/standards.yaml --section matching
#   python -m src.validate_run             --config configs/standards.yaml --section validation

task: Task200_standards
images:
  suspect_path: data/reference/Standards_NEG.xlsx
  mzml_path: data/mzml/standards
  output_folder: results/eic/standards
  rt_range:
  - 100
  - 1100
  rt_bin_size: 0.73
  mz_range:
  - 50
  - 1000
  mass_tol: 0.1
  length_spline: 5
  int_thres: 1000
labels:
  predictions_dir: results/yucca/results/Task200_standards/Task100_synth/UNet__2D/YuccaManager__YuccaPlanner/default/kfold_5_fold_0/version_0/best
  images_raw: results/yucca/raw_data/Task200_standards/imagesTs
  output_dir: results/clustering/standards/L3_erosion
  task_name: standards
  erosion_width: 3
  filters:
    labels: []
matching:
  input_dir: results/clustering/standards/L3_erosion/single_labels_overlap
  output_dir: results/clustering/standards/L3_erosion/clusters_k30
  k: 30
  binary: false
  filters:
    links: []
validation:
  branch: standneg
  results_path: data/reference/Standards_NEG.xlsx
  suspect_list_path: null
  suspect_list_sheet: SSList_NEG
  fill_min: 0.7
  qc_mzml: data/mzml/standards/230503_Batch2_13.mzML
  rt_range:
  - 100
  - 1100
  rt_bin_size: 0.73
  mz_window: null
  single_labels_dir: results/clustering/standards/L3_erosion/single_labels_overlap
  clusters_path: results/clustering/standards/L3_erosion/clusters_k30/final_matches.csv
  dda_path: null
  mona_library: data/libraries/mona_library.pkl
  library_tol: 0.1
  library_instrument: QTOF|Q-TOF
  output_dir: results/standards
  task_name: standards
  cosine_tol: 0.5
  dda_tol: 0.1
  sirius:
    enabled: false
    sirius_path: data/libraries/sirius/sirius.app/Contents/MacOS/sirius
    work_dir: results/Task200_standNeg/sirius
    sources:
    - unet
    - msdial
    profile: qtof
    top_k: 20
    min_ms2_int: 5000
    run_fingerprints: false
    timeout_seconds: 600
    login:
      enabled: true
      user_env: SIRIUS_USER
      password_env: SIRIUS_PASSWORD
