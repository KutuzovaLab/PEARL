# Wheat metabolomics, DIA (Waters MSE), 63 of 82 mzML selected by the reference table.
#   python -m src.mzml_to_npy               --config configs/wheat.yaml --section images
#   python -m src.taskconvert inference     --src results/eic/wheat/images --task Task201_wheat --prefix wheat
#   python -m src.yucca_inference_run       -t Task201_wheat -s Task100_synth -d 2D -m UNet --version 0
#   python -m src.extracting_labels_erosion --config configs/wheat.yaml --section labels
#   python -m src.matching_MS1_MS2          --config configs/wheat.yaml --section matching

task: Task201_wheat
images:
  acquisition: dia
  suspect_path: data/reference/DK_2021_Secondary metabolites_POS.csv
  mzml_path: data/mzml/wheat
  output_folder: results/eic/wheat
  rt_range:
  - 100
  - 1100
  rt_bin_size: 0.73
  mz_range:
  - 50
  - 1000
  mass_tol: 0.1
  length_spline: 5
  int_thres: 1000
  order_path: data/reference/selected_samples.xlsx
labels:
  predictions_dir: results/yucca/results/Task201_wheat/Task100_synth/UNet__2D/YuccaManager__YuccaPlanner/default/kfold_5_fold_0/version_0/best
  images_raw: results/yucca/raw_data/Task201_wheat/imagesTs
  output_dir: results/clustering/wheat/L3_erosion
  task_name: wheat
  erosion_width: 3
matching:
  input_dir: results/clustering/wheat/L3_erosion/single_labels_overlap
  output_dir: results/clustering/wheat/L3_erosion/clusters_k30
  k: 30
  binary: false
