#   python simulating_data_paper.py --config configs/config_simulating_data_paper.yaml

seed: 0
n_samples: 100
rt_bins: 3500            # image width = np.arange(0, 3500)
start_index: 70001
labels: [v1, v2, v3]
background: {mean: 500, sd: 200}
out_dir: ./simulated_data_local

subsets:
  # 20000 images: resolved, high + low intensity peaks per image
  - name: resolved_high_low
    n_images: 20000
    groups:
      - {intensity: [18000, 20000], int_sd: 10000, n_max: 3,  occurrence: [0.05, 1.0], noise_range: [0.01, 0.05]}   # High, 5-100%, noise 5%
      - {intensity: [2000, 5000],   int_sd: 500,   n_max: 20, occurrence: [0.05, 1.0], noise_range: [0.05, 0.30]}   # Low, 5-100%, noise 30%

  # 30000 images: resolved, low intensity only
  - name: resolved_low
    n_images: 30000
    groups:
      - {intensity: [2000, 5000], int_sd: 500, n_max: 30, occurrence: [0.05, 1.0], noise_range: [0.05, 0.30]}       # Low, 5-100%, noise 30%

  # 10,000 images: sparse, high + low intensity peaks per image
  - name: sparse_high_low
    n_images: 10000
    groups:
      - {intensity: [18000, 20000], int_sd: 10000, n_max: 1, occurrence: [0.01, 0.05], noise_range: [0.01, 0.05]}   # High, 1-5%, noise 5%
      - {intensity: [1000, 6000],   int_sd: 500,   n_max: 3, occurrence: [0.01, 0.05], noise_range: [0.05, 0.30]}   # Low, 1-5%, noise 30%
