# Wastewater, DDA (Orbitrap), 54 mzML. DDA images MS1 only, so matching is skipped.
#   python -m src.mzml_to_npy               --config configs/wastewater.yaml --section images
#   python -m src.taskconvert inference     --src results/eic/wastewater/images --task Task202_wastewater --prefix wastewater
#   python -m src.yucca_inference_run       -t Task202_wastewater -s Task100_synth -d 2D -m UNet --version 0
#   python -m src.extracting_labels_erosion --config configs/wastewater.yaml --section labels
#   python -m src.matching_MS1_MS2          --config configs/wastewater.yaml --section matching

task: Task202_wastewater
images:
  acquisition: dda
  suspect_path: null
  mzml_path: data/mzml/wastewater
  output_folder: results/eic/wastewater
  rt_range:
  - 0
  - 1000
  rt_bin_size: 0.45
  mz_range:
  - 75
  - 751
  mass_tol: 0.1
  int_thres: 1000
labels:
  predictions_dir: results/yucca/results/Task202_wastewater/Task100_synth/UNet__2D/YuccaManager__YuccaPlanner/default/kfold_5_fold_0/version_0/best
  images_raw: results/yucca/raw_data/Task202_wastewater/imagesTs
  output_dir: results/clustering/wastewater/L3_erosion
  task_name: wastewater
  erosion_width: 3
matching:
  input_dir: results/clustering/wastewater/L3_erosion/single_labels_overlap
  output_dir: results/clustering/wastewater/L3_erosion/clusters_k30
  k: 30
  binary: false
